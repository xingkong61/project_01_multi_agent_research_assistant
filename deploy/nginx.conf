# 多智能体研究助手 · Nginx 反向代理（L2）
# 放在 /etc/nginx/sites-available/research，软链到 sites-enabled 后 nginx -s reload
#
# 关键点：
#   - SSE 长连接：关闭 proxy_buffering、拉长 read timeout，否则几分钟的研究会被掐断
#   - Basic Auth 已在应用层实现；如需再加一层，可启用下面 auth_basic 注释块
#   - 全局 QPS 限流作为应用层令牌桶之外的第二道闸

# 限流区：每 IP 每分钟最多 10 次请求（与 .env 的 RATE_LIMIT_* 配合形成双层防护）
limit_req_zone $binary_remote_addr zone=research_rl:10m rate=10r/m;

server {
    listen 80;
    server_name research.example.com;     # ← 改成你的域名

    # HTTP → HTTPS 跳转（证书就绪后取消下一行注释，并改用 443 server 块承载站点）
    # return 301 https://$host$request_uri;

    client_max_body_size 1m;

    location / {
        limit_req zone=research_rl burst=5 nodelay;

        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # —— SSE / 长任务关键设置 ——
        proxy_buffering off;              # 不缓冲，实时把 trace 推给浏览器
        proxy_cache off;
        proxy_read_timeout 600s;          # 一次研究可能数分钟
        proxy_send_timeout 600s;
        chunked_transfer_encoding on;
        add_header X-Accel-Buffering no;

        # 可选：应用层之外再加一道 Basic Auth（口令文件 htpasswd -c /etc/nginx/.htpasswd user）
        # auth_basic "Restricted";
        # auth_basic_user_file /etc/nginx/.htpasswd;
    }

    # 静态资源可缓存（css/js），API 与首页不缓存
    location /static/ {
        proxy_pass http://127.0.0.1:8000;
        expires 7d;
        add_header Cache-Control "public";
    }
}

